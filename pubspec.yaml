name: WeekLife
description: A new Flutter project.
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ">=3.2.6 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  photo_manager: ^3.0.0
  photo_view: ^0.14.0
  exif: ^3.3.0
  path_provider: ^2.1.2
  path: ^1.8.3
  camera: ^0.10.5+9
  cross_file: ^0.3.3+8
  dio: ^5.8.0+1
  provider: ^6.1.5
  flutter_screenutil: ^5.9.3
  jh_debug: 2.0.1
  ana_page_loop: ^1.0.1
  shared_preferences: ^2.5.3 # 持久性存储
  synchronized: ^3.3.1
  ota_update: ^7.0.1
  package_info_plus: ^8.3.0 # app相关信息获取
  device_info_plus: ^10.1.2 # 设备信息获取
  url_launcher: ^6.3.1
  permission_handler: ^12.0.0+1 # 权限
  fluttertoast: ^8.2.12
  sqlite3_flutter_libs: ^0.5.32 # 承载 Android 或 iOS App 上的 sqlite3的最新版本。如果不使用Flutter，这不是必需的。但之后你需要自己把 sqlite3 包含进来。
  sqflite_common_ffi: ^2.3.5 # 支持 sqlite3 的 Flutter 插件。
  drift: ^2.26.1 # 定义了绝大部分 API 的核心包。
  freezed: ^2.4.7
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.0.2+1
  flutter_bloc: ^8.1.1
  equatable: ^2.0.5
  flutter_svg: ^2.0.17
  bruno: 3.4.3
  progressive_blur: ^0.0.1
  soft_edge_blur: ^0.1.3
  forui: ^0.12.0
  flutter_animate: ^4.5.2
  wechat_assets_picker: ^9.3.1
  wechat_camera_picker: ^4.3.1
  image_picker: ^1.1.2
  flutter_markdown: ^0.7.4+1
  markdown: ^7.2.2
  photo_manager_image_provider: ^2.1.3
  share_plus: ^10.1.2 # 分享功能
  crypto: ^3.0.3 # MD5计算
  # 提醒和日历相关
  flutter_local_notifications: ^18.0.1 # 本地通知
  add_2_calendar: ^3.0.1 # 添加到系统日历
  timezone: ^0.9.4 # 时区处理
  # 定位和地图相关
  geolocator: ^13.0.2 # 定位服务
  flutter_map: ^7.0.2 # 地图组件
  latlong2: ^0.9.1 # 经纬度处理
  http: ^1.2.2 # HTTP请求（用于地图瓦片）
  cached_network_image: ^3.4.1 # 网络图片缓存
  flutter_cache_manager: ^3.4.1 # 缓存管理器
  reorderable_grid_view: ^2.2.8
  native_exif: ^0.6.2 # EXIF信息写入

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  drift_dev: ^2.26.1 # 这个依赖只在开发环境使用，用来基于表生成查询代码。不会包含在最终的APP中。
  build_runner: ^2.4.8
  test: ^1.25.15
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  mockito: ^5.4.4
  freezed: ^2.4.7
  flutter_launcher_icons: ^0.13.1


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - asset/images/updateVersion/header/
    - asset/images/icon/1.0x/
    - asset/images/emoji/1.0x/
    - asset/images/emoji/
    - assets/icons/
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: EyeIcon
      fonts:
        - asset: asset/fonts/EyeIcon.ttf
    
    - family: MiSans
      fonts:
        - asset: asset/fonts/MiSans-Regular.ttf
        - asset: asset/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: asset/fonts/MiSans-Semibold.ttf
          weight: 600
        - asset: asset/fonts/MiSans-Bold.ttf
          weight: 700
        - asset: asset/fonts/MiSans-Heavy.ttf
          weight: 800
    
    - family: SourceHanSerif
      fonts:
        - asset: asset/fonts/SourceHanSerifSC-VF.ttf
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

dependency_overrides:
  # 因为 bruno 依赖的 intl 版本是 0.18.0，目前官方还没解决新 flutter 版本的兼容问题，只能强制指定 intl 版本。
  intl: 0.19.0

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "asset/images/icon/1.0x/launch_logo.png"  # 1024x1024 的图标
  min_sdk_android: 21
  min_sdk_ios: 13
  remove_alpha_ios: true